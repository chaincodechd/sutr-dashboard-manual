<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Lato,'Helvetica Neue',Arial,sans-serif" role="img" aria-label="MST anchoring data flow: blocks commit on the private Fabric channel, each transaction is hashed into a commitment, a relayer anchors the hash on the public MST Blockchain's MSTAnchor contract, and the confirmed anchor status is written back to the Fabric ledger">
  <defs>
    <marker id="arr-mf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="arr-mf-v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a3aa7"/>
    </marker>
  </defs>
  <text x="360" y="28" text-anchor="middle" font-size="14" fill="#6f6f6f" font-style="italic">Capture, anchor, write back — the pipeline runs inside each anchoring peer</text>

  <!-- Fabric world -->
  <rect x="20" y="48" width="330" height="330" rx="12" fill="#f2f8fc" stroke="#2980b9" stroke-width="1.5"/>
  <text x="185" y="74" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2c3e50">Fabric channel</text>
  <text x="185" y="92" text-anchor="middle" font-size="12.5" fill="#6f6f6f">private — members only</text>

  <!-- committing blocks -->
  <g fill="#1c5cab">
    <rect x="106" y="102" width="46" height="28" rx="4"/>
    <rect x="160" y="102" width="46" height="28" rx="4"/>
    <rect x="214" y="102" width="46" height="28" rx="4"/>
  </g>
  <g stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.9">
    <line x1="114" y1="112" x2="144" y2="112"/><line x1="114" y1="119" x2="136" y2="119"/>
    <line x1="168" y1="112" x2="198" y2="112"/><line x1="168" y1="119" x2="190" y2="119"/>
    <line x1="222" y1="112" x2="252" y2="112"/><line x1="222" y1="119" x2="244" y2="119"/>
  </g>
  <g stroke="#1c5cab" stroke-width="2" fill="#ffffff">
    <circle cx="156" cy="116" r="3.5"/>
    <circle cx="210" cy="116" r="3.5"/>
  </g>
  <text x="183" y="148" text-anchor="middle" font-size="12.5" fill="#6f6f6f">blocks commit</text>

  <line x1="185" y1="154" x2="185" y2="166" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr-mf)"/>

  <!-- Step 1: Capture -->
  <g>
    <rect x="40" y="170" width="290" height="58" rx="9" fill="#ffffff" stroke="#2980b9" stroke-width="1.5"/>
    <circle cx="62" cy="199" r="11" fill="#2980b9"/>
    <text x="62" y="203.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
    <text x="82" y="193" font-size="14" font-weight="700" fill="#2c3e50">Capture</text>
    <text x="82" y="212" font-size="12" fill="#6f6f6f">each transaction becomes a commitment (hash)</text>
    <text x="248" y="193" font-size="12" font-family="'Courier New',monospace" fill="#1c5cab">0x3ab0bcd3&#8230;</text>
  </g>

  <line x1="185" y1="228" x2="185" y2="240" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr-mf)"/>

  <!-- outbox -->
  <rect x="40" y="244" width="290" height="38" rx="9" fill="none" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="185" y="267" text-anchor="middle" font-size="12.5" fill="#6f6f6f">durable local <tspan font-weight="700" fill="#2c3e50">outbox</tspan> — waiting to anchor</text>

  <!-- Step 3: Write-back -->
  <g>
    <rect x="40" y="304" width="290" height="58" rx="9" fill="#ffffff" stroke="#2980b9" stroke-width="1.5"/>
    <circle cx="62" cy="333" r="11" fill="#2980b9"/>
    <text x="62" y="337.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
    <text x="82" y="327" font-size="14" font-weight="700" fill="#2c3e50">Write-back</text>
    <text x="82" y="346" font-size="12.5" fill="#6f6f6f">anchor status recorded on the ledger</text>
    <text x="262" y="327" font-size="12" font-family="'Courier New',monospace" fill="#1c5cab">mstscc</text>
  </g>

  <!-- MST world -->
  <rect x="478" y="48" width="222" height="330" rx="12" fill="#f0eef9" stroke="#4a3aa7" stroke-width="1.5"/>
  <text x="589" y="74" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2c3e50">MST Blockchain</text>
  <text x="589" y="92" text-anchor="middle" font-size="12.5" fill="#6f6f6f">public — independent</text>

  <g fill="#4a3aa7">
    <rect x="519" y="102" width="42" height="26" rx="4"/>
    <rect x="569" y="102" width="42" height="26" rx="4"/>
    <rect x="619" y="102" width="42" height="26" rx="4"/>
  </g>
  <g stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.9">
    <line x1="526" y1="111" x2="554" y2="111"/><line x1="526" y1="118" x2="547" y2="118"/>
    <line x1="576" y1="111" x2="604" y2="111"/><line x1="576" y1="118" x2="597" y2="118"/>
    <line x1="626" y1="111" x2="654" y2="111"/><line x1="626" y1="118" x2="647" y2="118"/>
  </g>
  <g stroke="#4a3aa7" stroke-width="2" fill="#ffffff">
    <circle cx="565" cy="115" r="3.5"/>
    <circle cx="615" cy="115" r="3.5"/>
  </g>

  <!-- MSTAnchor contract -->
  <g>
    <rect x="496" y="170" width="186" height="96" rx="9" fill="#ffffff" stroke="#4a3aa7" stroke-width="1.5"/>
    <text x="589" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#2c3e50">MSTAnchor</text>
    <text x="589" y="214" text-anchor="middle" font-size="14" font-weight="700" fill="#2c3e50">contract</text>
    <text x="589" y="236" text-anchor="middle" font-size="12.5" fill="#6f6f6f">stores the commitment</text>
    <text x="589" y="254" text-anchor="middle" font-size="12" font-family="'Courier New',monospace" fill="#4a3aa7">0x3ab0bcd3&#8230; @ block 42</text>
  </g>

  <!-- Step 2: Anchor (crossing arrow) -->
  <line x1="334" y1="263" x2="492" y2="222" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr-mf)"/>
  <g>
    <circle cx="401" cy="222" r="11" fill="#2980b9"/>
    <text x="401" y="226.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
    <text x="422" y="219" font-size="13.5" font-weight="700" fill="#2c3e50" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">Anchor</text>
  </g>
  <text x="413" y="262" text-anchor="middle" font-size="12" fill="#6f6f6f" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">relayer submits the hash</text>
  <text x="413" y="277" text-anchor="middle" font-size="12" fill="#6f6f6f" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">(pays gas)</text>

  <!-- confirmation return arrow -->
  <path d="M 496 260 C 440 300 400 320 336 331" fill="none" stroke="#4a3aa7" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-mf-v)"/>
  <text x="428" y="316" text-anchor="middle" font-size="12" fill="#4a3aa7" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">confirmed on-chain</text>

  <!-- privacy note -->
  <g>
    <rect x="80" y="404" width="560" height="42" rx="21" fill="#f5f5f5" stroke="#d0d0d0" stroke-width="1.5"/>
    <g stroke="#404040" stroke-width="1.8" fill="none" stroke-linecap="round">
      <rect x="102" y="423" width="14" height="11" rx="1.5"/>
      <path d="M 104.5 423 v -4 a 4.5 4.5 0 0 1 9 0 v 4"/>
    </g>
    <text x="128" y="429" font-size="13.5" fill="#404040">Private data <tspan font-weight="700">never leaves the channel</tspan> — only the one-way hash is published</text>
  </g>
</svg>
