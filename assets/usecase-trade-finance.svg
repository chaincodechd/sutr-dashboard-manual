<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 434" font-family="Lato,'Helvetica Neue',Arial,sans-serif" role="img" aria-label="Trade finance: exporter, importer and both banks share one deal record instead of couriering paper documents; letters of credit clear in about a day instead of ten">
  <text x="360" y="30" text-anchor="middle" font-size="14" fill="#6f6f6f" font-style="italic">All four parties see the same deal status at the same moment</text>

  <!-- Exporter (top-left, orange) -->
  <g>
    <rect x="30" y="60" width="170" height="72" rx="10" fill="#fdefe9" stroke="#eb6834" stroke-width="1.5"/>
    <text x="115" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Exporter</text>
    <text x="115" y="112" text-anchor="middle" font-size="13" fill="#6f6f6f">ships the goods</text>
  </g>
  <!-- Exporter's bank (bottom-left, orange) -->
  <g>
    <rect x="30" y="290" width="170" height="72" rx="10" fill="#fdefe9" stroke="#eb6834" stroke-width="1.5"/>
    <text x="115" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Exporter's bank</text>
    <text x="115" y="342" text-anchor="middle" font-size="13" fill="#6f6f6f">releases payment</text>
  </g>
  <!-- Importer (top-right, blue) -->
  <g>
    <rect x="520" y="60" width="170" height="72" rx="10" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.5"/>
    <text x="605" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Importer</text>
    <text x="605" y="112" text-anchor="middle" font-size="13" fill="#6f6f6f">buys the goods</text>
  </g>
  <!-- Importer's bank (bottom-right, blue) -->
  <g>
    <rect x="520" y="290" width="170" height="72" rx="10" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.5"/>
    <text x="605" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Importer's bank</text>
    <text x="605" y="342" text-anchor="middle" font-size="13" fill="#6f6f6f">guarantees payment</text>
  </g>

  <!-- Connectors to hub -->
  <g stroke="#8a8a8a" stroke-width="2" stroke-linecap="round">
    <line x1="200" y1="112" x2="250" y2="160"/>
    <line x1="200" y1="310" x2="250" y2="262"/>
    <line x1="520" y1="112" x2="470" y2="160"/>
    <line x1="520" y1="310" x2="470" y2="262"/>
  </g>

  <!-- Central shared deal record -->
  <g>
    <rect x="250" y="130" width="220" height="162" rx="12" fill="#1c5cab"/>
    <text x="360" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">One shared deal record</text>
    <g font-size="13.5" fill="#ffffff">
      <text x="278" y="190">Purchase order</text>
      <text x="278" y="214">Goods shipped</text>
      <text x="278" y="238">Goods inspected</text>
      <text x="278" y="262">Payment released</text>
    </g>
    <g font-size="13.5" font-weight="700">
      <text x="430" y="190" fill="#8fe28f" text-anchor="middle">done</text>
      <text x="430" y="214" fill="#8fe28f" text-anchor="middle">done</text>
      <text x="430" y="238" fill="#8fe28f" text-anchor="middle">done</text>
      <text x="430" y="262" fill="#ffd98a" text-anchor="middle">next</text>
    </g>
  </g>

  <!-- Replaced paper flow -->
  <text x="360" y="320" text-anchor="middle" font-size="13" fill="#9a9a9a" text-decoration="line-through">paper documents couriered bank to bank</text>

  <!-- Callout -->
  <g>
    <rect x="150" y="378" width="420" height="42" rx="21" fill="#f5f5f5" stroke="#d0d0d0" stroke-width="1.5"/>
    <text x="360" y="404" text-anchor="middle" font-size="14" fill="#404040">Letter of credit processing: <tspan fill="#9a9a9a" text-decoration="line-through">about 10 days</tspan>  <tspan font-weight="700" fill="#006300">about 1 day</tspan></text>
  </g>
</svg>
