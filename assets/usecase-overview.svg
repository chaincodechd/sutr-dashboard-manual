<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="Lato,'Helvetica Neue',Arial,sans-serif" role="img" aria-label="Four reasons enterprises use blockchain: one shared record, tamper-evident history, members-only access, automated rules">
  <!-- Tile 1: One shared record -->
  <g>
    <rect x="8" y="20" width="166" height="210" rx="10" fill="#f6fafd" stroke="#2980b9" stroke-width="1.5"/>
    <circle cx="91" cy="62" r="22" fill="#eaf2f8" stroke="#2980b9" stroke-width="2"/>
    <g stroke="#2980b9" stroke-width="2" fill="none" stroke-linecap="round">
      <rect x="80" y="52" width="22" height="20" rx="2"/>
      <line x1="91" y1="52" x2="91" y2="72"/>
      <line x1="84" y1="58" x2="88" y2="58"/>
      <line x1="94" y1="58" x2="98" y2="58"/>
      <line x1="84" y1="63" x2="88" y2="63"/>
      <line x1="94" y1="63" x2="98" y2="63"/>
    </g>
    <text x="91" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">One shared record</text>
    <text x="91" y="136" text-anchor="middle" font-size="13" fill="#6f6f6f">Every member works</text>
    <text x="91" y="154" text-anchor="middle" font-size="13" fill="#6f6f6f">from the same data —</text>
    <text x="91" y="172" text-anchor="middle" font-size="13" fill="#6f6f6f">no more reconciling</text>
    <text x="91" y="190" text-anchor="middle" font-size="13" fill="#6f6f6f">separate databases.</text>
  </g>
  <!-- Tile 2: Tamper-evident -->
  <g>
    <rect x="190" y="20" width="166" height="210" rx="10" fill="#f6fafd" stroke="#2980b9" stroke-width="1.5"/>
    <circle cx="273" cy="62" r="22" fill="#eaf2f8" stroke="#2980b9" stroke-width="2"/>
    <g stroke="#2980b9" stroke-width="2" fill="none" stroke-linecap="round">
      <rect x="264" y="60" width="18" height="14" rx="2"/>
      <path d="M 267 60 v -5 a 6 6 0 0 1 12 0 v 5"/>
      <line x1="273" y1="65" x2="273" y2="69"/>
    </g>
    <text x="273" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Tamper-evident</text>
    <text x="273" y="136" text-anchor="middle" font-size="13" fill="#6f6f6f">Once written, an entry</text>
    <text x="273" y="154" text-anchor="middle" font-size="13" fill="#6f6f6f">cannot be quietly</text>
    <text x="273" y="172" text-anchor="middle" font-size="13" fill="#6f6f6f">changed or deleted</text>
    <text x="273" y="190" text-anchor="middle" font-size="13" fill="#6f6f6f">by anyone.</text>
  </g>
  <!-- Tile 3: Members only -->
  <g>
    <rect x="372" y="20" width="166" height="210" rx="10" fill="#f6fafd" stroke="#2980b9" stroke-width="1.5"/>
    <circle cx="455" cy="62" r="22" fill="#eaf2f8" stroke="#2980b9" stroke-width="2"/>
    <g stroke="#2980b9" stroke-width="2" fill="none" stroke-linecap="round">
      <rect x="444" y="53" width="22" height="17" rx="2"/>
      <circle cx="451" cy="60" r="2.6"/>
      <line x1="457" y1="58" x2="462" y2="58"/>
      <line x1="457" y1="63" x2="462" y2="63"/>
    </g>
    <text x="455" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Members only</text>
    <text x="455" y="136" text-anchor="middle" font-size="13" fill="#6f6f6f">A private, permissioned</text>
    <text x="455" y="154" text-anchor="middle" font-size="13" fill="#6f6f6f">network — you decide</text>
    <text x="455" y="172" text-anchor="middle" font-size="13" fill="#6f6f6f">who joins and what</text>
    <text x="455" y="190" text-anchor="middle" font-size="13" fill="#6f6f6f">they can see.</text>
  </g>
  <!-- Tile 4: Automated rules -->
  <g>
    <rect x="554" y="20" width="158" height="210" rx="10" fill="#f6fafd" stroke="#2980b9" stroke-width="1.5"/>
    <circle cx="633" cy="62" r="22" fill="#eaf2f8" stroke="#2980b9" stroke-width="2"/>
    <g stroke="#2980b9" stroke-width="2" fill="none" stroke-linecap="round">
      <circle cx="633" cy="62" r="7"/>
      <circle cx="633" cy="62" r="2.4"/>
      <line x1="633" y1="51" x2="633" y2="55"/>
      <line x1="633" y1="69" x2="633" y2="73"/>
      <line x1="622" y1="62" x2="626" y2="62"/>
      <line x1="640" y1="62" x2="644" y2="62"/>
      <line x1="625.5" y1="54.5" x2="628.3" y2="57.3"/>
      <line x1="637.7" y1="66.7" x2="640.5" y2="69.5"/>
      <line x1="640.5" y1="54.5" x2="637.7" y2="57.3"/>
      <line x1="628.3" y1="66.7" x2="625.5" y2="69.5"/>
    </g>
    <text x="633" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#2c3e50">Automated rules</text>
    <text x="633" y="136" text-anchor="middle" font-size="13" fill="#6f6f6f">Smart contracts —</text>
    <text x="633" y="154" text-anchor="middle" font-size="13" fill="#6f6f6f">small programs that</text>
    <text x="633" y="172" text-anchor="middle" font-size="13" fill="#6f6f6f">apply the agreed rules</text>
    <text x="633" y="190" text-anchor="middle" font-size="13" fill="#6f6f6f">automatically.</text>
  </g>
</svg>
